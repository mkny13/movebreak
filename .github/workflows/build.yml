name: Build MoveBreak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Verification is the default security boundary. Jobs opt in to broader access below.
permissions:
  contents: read

concurrency:
  group: movebreak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4.4.0; review release notes before updating this SHA.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and self-test with ad-hoc signature
        run: ./scripts/build_app.sh

      - name: Run self-test suite
        run: ./build/MoveBreak --self-test
